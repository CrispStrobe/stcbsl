name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the protocol/codec layer is dependency-free; the replay tests run
      # offline against the byte-exact captures
      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
