[package]
name = "stcbsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Clean-room STC serial bootloader (ISP) flasher — STC89 protocol family"
repository = "https://github.com/CrispStrobe/stcbsl"
authors = ["CrispStrobe <cze+github@mailbox.org>"]
readme = "README.md"
keywords = ["stc", "8051", "isp", "bootloader", "flasher"]
categories = ["embedded", "command-line-utilities", "hardware-support"]

[features]
# The pure protocol/codec layer has no dependencies at all; `cargo test
# --no-default-features` exercises everything the replay tests cover, offline.
default = ["serial"]
serial = ["dep:serialport", "dep:libc"]

[dependencies]
serialport = { version = "4.9", optional = true }
# Only for a real tcdrain(2) on the raw fd — serialport's flush() did not
# guarantee the wire was empty on CH340/macOS (silicon, 2026-08-18).
libc = { version = "0.2", optional = true }

[[bin]]
name = "stcbsl"
path = "src/bin/stcbsl.rs"

[profile.release]
opt-level = 2

[[bin]]
name = "rxprobe"
required-features = ["serial"]
